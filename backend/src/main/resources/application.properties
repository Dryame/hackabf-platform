server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5433/hackabf_db
spring.datasource.username=admin
spring.datasource.password=adminpassword
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuration des métriques (Actuator)
management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.tags.application=hackabf-backend

# Configuration des métriques (Actuator)
management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.tags.application=hackabf-backend

# Configuration des métriques (Actuator)
management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.tags.application=hackabf-backend

# Configuration des métriques (Actuator)
management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.tags.application=hackabf-backend

# --- CONFIGURATION DES MÉTRIQUES AVANCÉES ---
# 1. Exposition des endpoints (Prometheus, Health, Metrics)
management.endpoints.web.exposure.include=health,metrics,prometheus

# 2. Activation explicite des métriques HTTP (Requêtes, Temps de réponse, Erreurs)
management.metrics.enable.http.server.requests=true

# 3. Activation explicite des métriques JDBC et du pool de connexions (HikariCP)
management.metrics.enable.jdbc=true
management.metrics.enable.hikaricp=true

# 4. Fréquence de mise à jour des métriques (toutes les 10 secondes)
management.metrics.export.prometheus.step=10s
