<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-6 bg-slate-800/50 p-8 rounded-2xl border border-slate-700 backdrop-blur-sm shadow-2xl">
    
    <div class="text-center">
      <h2 class="text-3xl font-extrabold text-white">Créer un compte</h2>
      <p class="mt-2 text-sm text-slate-400">Rejoignez la communauté HackaBF</p>
    </div>

    <form class="mt-6 space-y-4" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      
      <div *ngIf="errorMessage" class="bg-red-900/50 border border-red-500 text-red-300 px-4 py-2 rounded-lg text-sm text-center">
        {{ errorMessage }}
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Nom complet</label>
        <input type="text" formControlName="nomComplet" class="w-full px-4 py-2 border border-slate-600 bg-slate-900 text-white rounded-lg focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Email</label>
        <input type="email" formControlName="email" class="w-full px-4 py-2 border border-slate-600 bg-slate-900 text-white rounded-lg focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Mot de passe</label>
        <input type="password" formControlName="motDePasse" class="w-full px-4 py-2 border border-slate-600 bg-slate-900 text-white rounded-lg focus:ring-2 focus:ring-indigo-500">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Établissement</label>
          <input type="text" formControlName="etablissement" placeholder="Ex: ESI" class="w-full px-4 py-2 border border-slate-600 bg-slate-900 text-white rounded-lg focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Ville</label>
          <input type="text" formControlName="ville" placeholder="Ex: Ouaga" class="w-full px-4 py-2 border border-slate-600 bg-slate-900 text-white rounded-lg focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Niveau d'étude</label>
        <select formControlName="niveauEtude" class="w-full px-4 py-2 border border-slate-600 bg-slate-900 text-white rounded-lg focus:ring-2 focus:ring-indigo-500">
          <option value="" disabled selected>Sélectionnez votre niveau</option>
          <option value="L1">Licence 1</option>
          <option value="L2">Licence 2</option>
          <option value="L3">Licence 3</option>
          <option value="M1">Master 1</option>
          <option value="M2">Master 2</option>
        </select>
      </div>

      <button type="submit" [disabled]="registerForm.invalid || isLoading" class="w-full py-3 px-4 text-sm font-bold rounded-lg text-white bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 transition-all shadow-lg shadow-indigo-500/30 mt-4">
        <span *ngIf="!isLoading">S'inscrire</span>
        <span *ngIf="isLoading">Création du compte...</span>
      </button>
    </form>

    <div class="text-center mt-2">
      <p class="text-sm text-slate-400">
        Déjà un compte ? <a routerLink="/login" class="text-indigo-400 hover:text-indigo-300">Se connecter</a>
      </p>
    </div>
  </div>
</div>
