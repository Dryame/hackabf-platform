<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-slate-800/50 p-10 rounded-2xl border border-slate-700 backdrop-blur-sm shadow-2xl">
    
    <div class="text-center">
      <h2 class="mt-6 text-3xl font-extrabold text-white">Connexion</h2>
      <p class="mt-2 text-sm text-slate-400">
        Accédez à votre espace HackaBF
      </p>
    </div>

    <form class="mt-8 space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <!-- Message d'erreur -->
      <div *ngIf="errorMessage" class="bg-red-900/50 border border-red-500 text-red-300 px-4 py-3 rounded-lg text-sm text-center">
        {{ errorMessage }}
      </div>

      <div class="space-y-4">
        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Adresse Email</label>
          <input 
            type="email" 
            formControlName="email"
            class="appearance-none relative block w-full px-4 py-3 border border-slate-600 bg-slate-900 placeholder-slate-500 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-all"
            placeholder="idrissa@test.bf">
        </div>

        <!-- Mot de passe -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Mot de passe</label>
          <input 
            type="password" 
            formControlName="motDePasse"
            class="appearance-none relative block w-full px-4 py-3 border border-slate-600 bg-slate-900 placeholder-slate-500 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-all"
            placeholder="••••••••">
        </div>
      </div>

      <!-- Bouton de soumission -->
      <div>
        <button 
          type="submit" 
          [disabled]="loginForm.invalid || isLoading"
          class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-lg text-white bg-indigo-600 hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-lg shadow-indigo-500/30">
          <span *ngIf="!isLoading">Se connecter</span>
          <span *ngIf="isLoading">Connexion en cours...</span>
        </button>
      </div>
    </form>

    <div class="text-center mt-4">
      <p class="text-sm text-slate-400">
        Pas encore de compte ? 
        <a routerLink="/register" class="font-medium text-indigo-400 hover:text-indigo-300 transition-colors">S'inscrire</a>
      </p>
    </div>
  </div>
</div>
