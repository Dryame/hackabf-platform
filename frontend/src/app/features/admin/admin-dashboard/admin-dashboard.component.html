<div class="max-w-7xl mx-auto py-12 px-4">
  
  <div class="mb-8">
    <h1 class="text-4xl font-bold text-white mb-2">Espace Administrateur</h1>
    <p class="text-slate-400">Gérez les utilisateurs et les accès à la plateforme.</p>
  </div>

  <!-- SECTION GESTION DES UTILISATEURS -->
  <h2 class="text-2xl font-bold text-white mb-6">Gestion des Utilisateurs</h2>
  <div *ngIf="isLoading" class="text-center py-20 text-slate-400">Chargement des utilisateurs...</div>

  <div *ngIf="!isLoading" class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-2xl">
    <table class="w-full text-left text-sm text-slate-300">
      <thead class="text-xs uppercase bg-slate-900 text-slate-400">
        <tr>
          <th class="px-6 py-4">Utilisateur</th>
          <th class="px-6 py-4">Rôle</th>
          <th class="px-6 py-4">Statut</th>
          <th class="px-6 py-4 text-right">Action</th>
        </tr>
      </thead>
      <tbody>
        @for (user of utilisateurs; track user.id) {
          <tr class="border-b border-slate-700 hover:bg-slate-800/50">
            <td class="px-6 py-4">
              <div class="font-medium text-white">{{ user.nomComplet }}</div>
              <div class="text-xs text-slate-500">{{ user.email }}</div>
            </td>
            <td class="px-6 py-4">
              <select (change)="changerRole(user.id, $event)" class="bg-slate-900 border border-slate-600 text-sm rounded-lg p-2">
                <option value="ROLE_ETUDIANT" [selected]="user.roles.includes('ROLE_ETUDIANT')">Étudiant</option>
                <option value="ROLE_EDITEUR" [selected]="user.roles.includes('ROLE_EDITEUR')">Éditeur</option>
                <option value="ROLE_ADMIN" [selected]="user.roles.includes('ROLE_ADMIN')">Admin</option>
              </select>
            </td>
            <td class="px-6 py-4">
              @if (user.estActif) {
                <span class="bg-emerald-900/50 text-emerald-400 border border-emerald-700 px-2 py-1 rounded text-xs">Actif</span>
              } @else {
                <span class="bg-red-900/50 text-red-400 border border-red-700 px-2 py-1 rounded text-xs">Banni</span>
              }
            </td>
            <td class="px-6 py-4 text-right">
              <button (click)="toggleStatus(user.id)" class="px-3 py-1 rounded border border-slate-600 text-xs font-bold"
                [ngClass]="user.estActif ? 'bg-red-600/20 text-red-400' : 'bg-emerald-600/20 text-emerald-400'">
                {{ user.estActif ? 'Bannir' : 'Réactiver' }}
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

</div>
