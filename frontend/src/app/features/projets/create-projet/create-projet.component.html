<div class="max-w-3xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
  <div class="bg-slate-800/50 p-8 rounded-2xl border border-slate-700 shadow-2xl backdrop-blur-sm">
    <h2 class="text-3xl font-extrabold text-white mb-2 text-center">Publier un Projet (PFA/PFE)</h2>
    <p class="text-slate-400 text-center mb-8">Partagez un sujet de projet avec les étudiants de la communauté.</p>

    <div *ngIf="message" class="bg-red-900/50 border border-red-500 text-red-300 px-4 py-3 rounded-lg text-sm mb-6 text-center">
      {{ message }}
    </div>

    <form [formGroup]="projetForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Titre du projet</label>
        <input type="text" formControlName="titre" class="w-full px-4 py-3 border border-slate-600 bg-slate-900 text-white rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="Ex: Développement d'une application de gestion...">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Description</label>
        <textarea formControlName="description" rows="4" class="w-full px-4 py-3 border border-slate-600 bg-slate-900 text-white rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="Décrivez les objectifs et les livrables attendus..."></textarea>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Type de projet</label>
          <select formControlName="typeProjet" class="w-full px-4 py-3 border border-slate-600 bg-slate-900 text-white rounded-lg focus:ring-2 focus:ring-indigo-500">
            <option value="PFA">PFA (Projet de Fin d'Année)</option>
            <option value="PFE">PFE (Projet de Fin d'Études)</option>
            <option value="PORTFOLIO">Projet Portfolio</option>
            <option value="PERFECTIONNEMENT">Perfectionnement / Défi</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Catégorie Tech</label>
          <select formControlName="categorieId" class="w-full px-4 py-3 border border-slate-600 bg-slate-900 text-white rounded-lg focus:ring-2 focus:ring-indigo-500">
            <option value="" disabled selected>Choisir une catégorie</option>
            @for (cat of categories; track cat.id) {
              <option [value]="cat.id">{{ cat.nom }}</option>
            }
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Niveau requis</label>
          <select formControlName="niveauRequis" class="w-full px-4 py-3 border border-slate-600 bg-slate-900 text-white rounded-lg focus:ring-2 focus:ring-indigo-500">
            <option value="TOUS">Tous niveaux</option>
            <option value="L1">Licence 1</option>
            <option value="L2">Licence 2</option>
            <option value="L3">Licence 3</option>
            <option value="M1">Master 1</option>
            <option value="M2">Master 2</option>
            <option value="INGENIEUR">Cycle Ingénieur</option>
            <option value="AUTODIDACTE">Autodidacte / Bootcamp</option> <!-- NOUVEAU -->
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Année Académique</label>
          <input type="text" formControlName="anneeAcademique" class="w-full px-4 py-3 border border-slate-600 bg-slate-900 text-white rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="Ex: 2024-2025">
        </div>
      </div>

      <!-- UPLOAD D'IMAGE -->
      <div class="border-2 border-dashed border-slate-600 rounded-lg p-6 text-center hover:bg-slate-800/50 transition-colors">
        <label class="cursor-pointer block">
          <span class="text-slate-300 block mb-2 font-medium">📸 Ajouter une affiche (Optionnel)</span>
          <input type="file" (change)="onFileSelected($event)" accept="image/*" class="hidden">
          <span class="inline-block bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg transition-colors mt-2">
            Choisir une image
          </span>
        </label>
        @if (imagePreviewUrl) {
          <div class="mt-6">
            <img [src]="imagePreviewUrl" alt="Aperçu" class="max-h-48 mx-auto rounded-lg shadow-lg border border-slate-600 object-cover">
          </div>
        }
      </div>

      <button type="submit" [disabled]="projetForm.invalid || isSubmitting" class="w-full py-4 text-lg font-bold rounded-lg text-white bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 transition-all shadow-lg shadow-indigo-500/30">
        <span *ngIf="!isSubmitting">Publier le projet</span>
        <span *ngIf="isSubmitting">Publication en cours...</span>
      </button>
