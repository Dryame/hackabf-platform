<div class="max-w-7xl mx-auto py-8 px-4">
  <div class="mb-10 text-center">
    <h1 class="text-4xl font-bold text-white mb-4">Tous les Hackathons</h1>
    <p class="text-slate-400">Découvrez les opportunités tech au Burkina Faso.</p>
  </div>

  <!-- Barre de recherche et Filtres -->
  <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 mb-8">
    <div class="flex flex-col md:flex-row gap-4 mb-6">
      <input 
        type="text" 
        [(ngModel)]="searchTerm" 
        (ngModelChange)="filterData()"
        placeholder="Rechercher un hackathon..." 
        class="w-full px-4 py-3 border border-slate-600 bg-slate-900 text-white rounded-lg focus:ring-2 focus:ring-indigo-500">
    </div>
    
    <div class="flex flex-wrap gap-2">
      @for (cat of categories; track cat) {
        <button 
          (click)="setCategorie(cat)"
          [ngClass]="selectedCategorie === cat ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'"
          class="px-4 py-2 rounded-full text-sm font-medium transition-colors">
          {{ cat }}
        </button>
      }
    </div>
  </div>

  <div *ngIf="isLoading" class="text-center py-20 text-slate-400">Chargement...</div>

  <div *ngIf="!isLoading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (hackathon of filteredHackathons; track hackathon.id) {
      <app-hackathon-card [hackathon]="hackathon"></app-hackathon-card>
    } @empty {
      <div class="col-span-full text-center py-16 bg-slate-800/50 rounded-xl border border-slate-700 border-dashed">
        <p class="text-slate-400">Aucun hackathon ne correspond à votre recherche.</p>
      </div>
    }
  </div>
</div>
