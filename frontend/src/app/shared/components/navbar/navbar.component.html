<header class="absolute top-0 w-full z-50 flex flex-col">
  
  <!-- TOP BAR (Épurée) -->
  <div class="w-full border-b border-emerald-800/30 bg-[#0A3622]/80 backdrop-blur-sm">
    <div class="w-full px-4 sm:px-6 py-2 flex justify-between items-center text-xs text-white/80">
      <div class="flex items-center gap-6">
        <span class="flex items-center gap-2 whitespace-nowrap">
          <span>🇧🇫</span> Burkina Faso
        </span>
        <span class="hidden sm:block italic text-emerald-100/70 whitespace-nowrap">Innover. Collaborer. Réaliser.</span>
      </div>
      
      <div class="flex items-center">
        <div class="flex items-center gap-2 bg-[#0D4A2F] px-3 py-1 rounded-full border border-emerald-700/50 shadow-[0_0_10px_rgba(16,185,129,0.2)] whitespace-nowrap">
          <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
          <span class="text-emerald-100 font-medium">Hackathons en cours : <span class="text-white font-bold">03</span></span>
        </div>
      </div>
    </div>
  </div>

  <!-- NAVBAR PRINCIPALE -->
  <div class="w-full bg-[#0A3622]/95 backdrop-blur-xl border-b border-emerald-800/50 shadow-2xl">
    <div class="w-full px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
      
      <!-- LOGO -->
      <a routerLink="/" class="flex items-center gap-2 group shrink-0">
        <img src="images/logo.png" alt="H" class="h-10 w-auto object-contain transition-transform group-hover:scale-105">
        <span class="font-black text-2xl tracking-tighter text-white whitespace-nowrap hidden sm:block">Hacka<span class="text-yellow-400">BF</span></span>
      </a>

      <!-- LIENS FONCTIONNELS (Centrés) -->
      <div class="hidden md:flex items-center gap-2">
        <a routerLink="/" routerLinkActive="bg-[#0D4A2F] text-white shadow-sm" [routerLinkActiveOptions]="{exact: true}" class="px-5 py-2.5 rounded-full text-sm font-semibold text-emerald-100/70 hover:text-white hover:bg-white/5 transition-all">
          Accueil
        </a>
        <a routerLink="/hackathons" routerLinkActive="bg-[#0D4A2F] text-white shadow-sm" class="px-5 py-2.5 rounded-full text-sm font-semibold text-emerald-100/70 hover:text-white hover:bg-white/5 transition-all">
          Catalogue des Hackathons
        </a>
        
        <!-- Liens visibles uniquement si connecté -->
        <ng-container *ngIf="authService.isLoggedIn()">
          <a routerLink="/mon-espace" routerLinkActive="bg-[#0D4A2F] text-white shadow-sm" class="px-5 py-2.5 rounded-full text-sm font-semibold text-emerald-100/70 hover:text-white hover:bg-white/5 transition-all">
            Mon Espace
          </a>
          <a routerLink="/admin" routerLinkActive="bg-red-900/40 text-red-400 shadow-sm" class="px-5 py-2.5 rounded-full text-sm font-bold text-red-500 hover:text-red-400 hover:bg-white/5 transition-all">
            Admin
          </a>
        </ng-container>
      </div>

      <!-- ACTIONS (Droite) -->
      <div class="flex items-center gap-3 shrink-0">
        
        <!-- SI NON CONNECTÉ -->
        <ng-container *ngIf="!authService.isLoggedIn()">
          <a routerLink="/login" class="text-sm font-semibold text-emerald-100/70 hover:text-white transition-colors px-3">
            Connexion
          </a>
          <a routerLink="/register" class="bg-yellow-400 hover:bg-yellow-500 text-[#0A3622] px-6 py-2.5 rounded-full text-sm font-bold transition-all shadow-[0_0_15px_rgba(250,204,21,0.3)] whitespace-nowrap">
            Créer un compte
          </a>
        </ng-container>

        <!-- SI CONNECTÉ -->
        <ng-container *ngIf="authService.isLoggedIn()">
          <!-- Bouton Publier -->
          <a routerLink="/publier" class="hidden sm:flex bg-white hover:bg-slate-100 text-[#0A3622] px-5 py-2.5 rounded-full text-sm font-black transition-transform transform hover:scale-105 shadow-lg items-center gap-1 mr-2">
            <span class="text-yellow-500 text-lg leading-none">+</span> Publier
          </a>

          <!-- Menu Profil -->
          <div class="relative group cursor-pointer">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full bg-gradient-to-br from-yellow-400 to-yellow-600 p-[2px] shadow-lg">
                <div class="w-full h-full bg-[#0A3622] rounded-full flex items-center justify-center text-white font-bold text-sm border-2 border-[#0A3622]">
                  {{ authService.getUserInitials() }}
                </div>
              </div>
            </div>

            <!-- Dropdown Menu -->
            <div class="absolute right-0 top-full mt-3 w-48 bg-[#0A3622] border border-emerald-700/50 rounded-xl shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50 overflow-hidden transform origin-top-right">
              <div class="p-2">
                <a routerLink="/mon-espace" class="block px-4 py-2.5 text-sm font-medium text-emerald-100 hover:bg-emerald-800/50 hover:text-white rounded-lg transition-colors">Mon Profil</a>
                <div class="h-px bg-emerald-800/50 my-1 mx-2"></div>
                <button (click)="logout()" class="block w-full text-left px-4 py-2.5 text-sm font-bold text-red-400 hover:bg-red-500/10 rounded-lg transition-colors">Déconnexion</button>
              </div>
            </div>
          </div>
        </ng-container>

      </div>

    </div>
  </div>
</header>
