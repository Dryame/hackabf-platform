<nav class="bg-slate-950 border-b border-slate-800 sticky top-0 z-50">

          <a routerLink="/hackathons" routerLinkActive="bg-slate-800 text-white" class="text-slate-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">Hackathons</a>
          
          <a *ngIf="authService.isLoggedIn()" routerLink="/mon-espace" routerLinkActive="bg-slate-800 text-white" class="text-slate-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">Mon Espace</a>
          <a *ngIf="authService.isLoggedIn()" routerLink="/publier" routerLinkActive="text-indigo-400 bg-slate-800" class="text-indigo-400 font-bold hover:text-indigo-300 px-3 py-2 rounded-md text-sm flex items-center gap-1 transition-colors">
