services:
  postgres-db:
    image: postgres:15-alpine
    container_name: hackabf-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: hackabf_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: hackabf-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/hackabf_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=adminpassword
    depends_on:
      - postgres-db

  frontend:
    build: ./frontend
    container_name: hackabf-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
